name: CI

# Checks run on every push and pull request. Publishing to GitHub Pages happens only when the
# workflow is started manually (Actions → CI → Run workflow) with "deploy" enabled, after review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built frontend to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  frontend-test:
    name: Frontend typecheck and tests
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tag is published
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  worker:
    name: TS Worker typecheck, parity tests and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle without deploying (no Cloudflare credentials in CI)
        run: npx wrangler deploy --dry-run --outdir dist

  build:
    name: Build frontend
    needs: [frontend-test, backend, worker]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # GitHub Pages serves the project from /<repo>/.
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # Public backend URL, configured as a repository variable (not a secret).
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Require backend URL for deployable builds
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: test -n "$VITE_API_URL" || (echo "Set repository variable VITE_API_URL" && exit 1)
      - run: npm run build
      - name: Check the pdf.js worker is emitted under the Pages base path
        run: grep -q "${VITE_BASE_PATH}assets/pdf.worker" dist/assets/*.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
